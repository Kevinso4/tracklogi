# Shipment Service por sí solo: su base de datos (restaurada desde db/) y RabbitMQ.
#   docker compose up --build        → http://localhost:${PUERTO:-8000}/docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: logitrack
      POSTGRES_DB: shipment_db
    volumes:
      # Al crear el volumen se restaura el esquema y los datos de ejemplo.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/datos_ejemplo.sql:/docker-entrypoint-initdb.d/20-datos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U logitrack -d shipment_db"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: logitrack
      RABBITMQ_DEFAULT_PASS: logitrack
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  shipment:
    build:
      context: ..
      args:
        SERVICE: shipment
    environment:
      DATABASE_URL: postgresql+psycopg://logitrack:logitrack@postgres:5432/shipment_db
      RABBITMQ_URL: amqp://logitrack:logitrack@rabbitmq:5672/
    ports:
      - "${PUERTO:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
