# CI/CD de routing: invoca el pipeline reutilizable de logitrack-pipelines (test → docker → deploy).
# En tracklogi (integración) solo prueba y publica la imagen; el repositorio logitrack-routing además despliega.
name: CI-CD routing

on:
  push:
    branches: [main]
    paths: ["services/routing/**", "services/common/**", "services/requirements.txt", "services/Dockerfile", ".github/workflows/routing.yml"]
  pull_request:
    branches: [main]
    paths: ["services/routing/**", "services/common/**", "services/requirements.txt", "services/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Kevinso4/logitrack-pipelines/.github/workflows/ci.yml@main
    with:
      service-name: routing
      directorio: services
      imagen: ghcr.io/kevinso4/tracklogi-routing
      desplegar: false
      url: https://tracklogi-routing.onrender.com
      render-service-id: srv-db7bqfo473hc73cpk9mg
    secrets: inherit
