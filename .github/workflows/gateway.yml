# CI/CD de gateway: invoca el pipeline reutilizable de logitrack-pipelines (test → docker → deploy).
# En tracklogi (integración) solo prueba y publica la imagen; el repositorio logitrack-gateway además despliega.
name: CI-CD gateway

on:
  push:
    branches: [main]
    paths: ["services/gateway/**", "services/common/**", "services/requirements.txt", "services/Dockerfile", ".github/workflows/gateway.yml"]
  pull_request:
    branches: [main]
    paths: ["services/gateway/**", "services/common/**", "services/requirements.txt", "services/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Kevinso4/logitrack-pipelines/.github/workflows/ci.yml@main
    with:
      service-name: gateway
      directorio: services
      imagen: ghcr.io/kevinso4/tracklogi-gateway
      desplegar: false
      url: https://tracklogi-gateway.onrender.com
    secrets: inherit
