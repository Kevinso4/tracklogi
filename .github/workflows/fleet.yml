# CI/CD de fleet: invoca el pipeline reutilizable de logitrack-pipelines (test → docker → deploy).
# En tracklogi (integración) solo prueba y publica la imagen; el repositorio logitrack-fleet además despliega.
name: CI-CD fleet

on:
  push:
    branches: [main]
    paths: ["services/fleet/**", "services/common/**", "services/requirements.txt", "services/Dockerfile", ".github/workflows/fleet.yml"]
  pull_request:
    branches: [main]
    paths: ["services/fleet/**", "services/common/**", "services/requirements.txt", "services/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Kevinso4/logitrack-pipelines/.github/workflows/ci.yml@main
    with:
      service-name: fleet
      directorio: services
      imagen: ghcr.io/kevinso4/tracklogi-fleet
      desplegar: false
      url: https://tracklogi-fleet.onrender.com
    secrets: inherit
