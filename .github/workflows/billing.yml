# CI/CD de billing: invoca el pipeline reutilizable de logitrack-pipelines (test → docker → deploy).
# En tracklogi (integración) solo prueba y publica la imagen; el repositorio logitrack-billing además despliega.
name: CI-CD billing

on:
  push:
    branches: [main]
    paths: ["services/billing/**", "services/common/**", "services/requirements.txt", "services/Dockerfile", ".github/workflows/billing.yml"]
  pull_request:
    branches: [main]
    paths: ["services/billing/**", "services/common/**", "services/requirements.txt", "services/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Kevinso4/logitrack-pipelines/.github/workflows/ci.yml@main
    with:
      service-name: billing
      directorio: services
      imagen: ghcr.io/kevinso4/tracklogi-billing
      desplegar: false
      url: https://tracklogi-billing.onrender.com
      render-service-id: srv-db7bqi2d0e5s7381le80
    secrets: inherit
