# CI/CD de tracking: invoca el pipeline reutilizable de logitrack-pipelines (test → docker → deploy).
# En tracklogi (integración) solo prueba y publica la imagen; el repositorio logitrack-tracking además despliega.
name: CI-CD tracking

on:
  push:
    branches: [main]
    paths: ["services/tracking/**", "services/common/**", "services/requirements.txt", "services/Dockerfile", ".github/workflows/tracking.yml"]
  pull_request:
    branches: [main]
    paths: ["services/tracking/**", "services/common/**", "services/requirements.txt", "services/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Kevinso4/logitrack-pipelines/.github/workflows/ci.yml@main
    with:
      service-name: tracking
      directorio: services
      imagen: ghcr.io/kevinso4/tracklogi-tracking
      desplegar: false
      url: https://tracklogi-tracking.onrender.com
      render-service-id: srv-daqqfod9fdbs73c06770
    secrets: inherit
