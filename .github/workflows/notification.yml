# CI/CD de notification: invoca el pipeline reutilizable de logitrack-pipelines (test → docker → deploy).
# En tracklogi (integración) solo prueba y publica la imagen; el repositorio logitrack-notification además despliega.
name: CI-CD notification

on:
  push:
    branches: [main]
    paths: ["services/notification/**", "services/common/**", "services/requirements.txt", "services/Dockerfile", ".github/workflows/notification.yml"]
  pull_request:
    branches: [main]
    paths: ["services/notification/**", "services/common/**", "services/requirements.txt", "services/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Kevinso4/logitrack-pipelines/.github/workflows/ci.yml@main
    with:
      service-name: notification
      directorio: services
      imagen: ghcr.io/kevinso4/tracklogi-notification
      desplegar: false
      url: https://tracklogi-notification.onrender.com
      render-service-id: srv-db7bqh8473hc73cpki30
    secrets: inherit
