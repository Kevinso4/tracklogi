# CI/CD de shipment: invoca el pipeline reutilizable de logitrack-pipelines (test → docker → deploy).
# En tracklogi (integración) solo prueba y publica la imagen; el repositorio logitrack-shipment además despliega.
name: CI-CD shipment

on:
  push:
    branches: [main]
    paths: ["services/shipment/**", "services/common/**", "services/requirements.txt", "services/Dockerfile", ".github/workflows/shipment.yml"]
  pull_request:
    branches: [main]
    paths: ["services/shipment/**", "services/common/**", "services/requirements.txt", "services/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Kevinso4/logitrack-pipelines/.github/workflows/ci.yml@main
    with:
      service-name: shipment
      directorio: services
      imagen: ghcr.io/kevinso4/tracklogi-shipment
      desplegar: false
      url: https://tracklogi-shipment.onrender.com
      render-service-id: srv-daqqfgs9v7es73fo6np0
    secrets: inherit
