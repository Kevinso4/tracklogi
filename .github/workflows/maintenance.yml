# CI/CD de maintenance: invoca el pipeline reutilizable de logitrack-pipelines (test → docker → deploy).
# En tracklogi (integración) solo prueba y publica la imagen; el repositorio logitrack-maintenance además despliega.
name: CI-CD maintenance

on:
  push:
    branches: [main]
    paths: ["services/maintenance/**", "services/common/**", "services/requirements.txt", "services/Dockerfile", ".github/workflows/maintenance.yml"]
  pull_request:
    branches: [main]
    paths: ["services/maintenance/**", "services/common/**", "services/requirements.txt", "services/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: Kevinso4/logitrack-pipelines/.github/workflows/ci.yml@main
    with:
      service-name: maintenance
      directorio: services
      imagen: ghcr.io/kevinso4/tracklogi-maintenance
      desplegar: false
      url: https://tracklogi-maintenance.onrender.com
    secrets: inherit
